name: publish-image

permissions: {}

on:
  workflow_dispatch:
  release:
    types: published

jobs:
  publish:
    uses: wittdennis/pipelines/.github/workflows/container-image-publish.yaml@c266d3ab242fbabe3bc4d4e3dad0316d4133c988 # 2.0.68
    permissions:
      contents: read
      packages: write
    with:
      image-name: cloudnative-pg-postgres-18
      registries: |
        docker.io
        ghcr.io
      registry-namespaces: |
        denniswitt
        wittdennis
    secrets:
      registry-passwords: |
        ${{ secrets.DOCKER_REGISTRY_TOKEN }}
        ${{ secrets.GITHUB_TOKEN }}
