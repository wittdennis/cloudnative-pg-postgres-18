name: publish-image

permissions: {}

on:
  workflow_dispatch:
  release:
    types: published

jobs:
  publish:
    uses: wittdennis/pipelines/.github/workflows/container-image-publish.yaml@1d8d497ce041021d980ccca647133a342d8290bb # 2.0.49
    permissions:
      contents: read
      packages: write
    with:
      image-name: cloudnative-pg-postgres-18
      registries: |
        docker.io
        ghcr.io
      registry-namespaces: |
        denniswitt
        wittdennis
    secrets:
      registry-passwords: |
        ${{ secrets.DOCKER_REGISTRY_TOKEN }}
        ${{ secrets.GITHUB_TOKEN }}
