name: publish-image

permissions: {}

on:
  workflow_dispatch:
  release:
    types: published

jobs:
  publish:
    uses: wittdennis/pipelines/.github/workflows/container-image-publish.yaml@55a4ef8250a05ec5e8d43a3f0fb6050af4ddec3b # 2.0.70
    permissions:
      contents: read
      packages: write
    with:
      image-name: cloudnative-pg-postgres-18
      registries: |
        docker.io
        ghcr.io
      registry-namespaces: |
        denniswitt
        wittdennis
    secrets:
      registry-passwords: |
        ${{ secrets.DOCKER_REGISTRY_TOKEN }}
        ${{ secrets.GITHUB_TOKEN }}
