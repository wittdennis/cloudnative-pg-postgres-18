name: publish-image

permissions: {}

on:
  workflow_dispatch:
  release:
    types: published

jobs:
  publish:
    uses: wittdennis/pipelines/.github/workflows/container-image-publish.yaml@c60129fdec11c0ced690c6f35fb37dcb488e63f4 # 2.0.44
    permissions:
      contents: read
      packages: write
    with:
      image-name: cloudnative-pg-postgres-18
      registries: |
        docker.io
        ghcr.io
      registry-namespaces: |
        denniswitt
        wittdennis
    secrets:
      registry-passwords: |
        ${{ secrets.DOCKER_REGISTRY_TOKEN }}
        ${{ secrets.GITHUB_TOKEN }}
